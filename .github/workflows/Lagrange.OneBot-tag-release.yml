name: Lagrange.OneBot Nightly Release

on:
  push:
    branches:
      - master
    paths:
      - "Lagrange.Core/**"
      - "Lagrange.OneBot/**"
      - "Lagrange.Core.sln"
      - "LICENSE"
      - "!Lagrange.OneBot/Resources/Dockerfile"
      - "!Lagrange.OneBot/Resources/docker-entrypoint.sh"
  workflow_dispatch:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        runtimeIdentifier:
          [
            win-x64,
            win-x86,
            linux-x64,
            linux-arm,
            linux-arm64,
            osx-x64,
            osx-arm64
          ]
        framework:
          [net8.0, net9.0]

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build (${{ matrix.framework }} ${{ matrix.runtimeIdentifier }})
        run: dotnet publish Lagrange.OneBot/Lagrange.OneBot.csproj --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:RuntimeIdentifier=${{ matrix.runtimeIdentifier }} --framework ${{ matrix.framework }}

      - name: Package (Windows → zip)
        if: contains(matrix.runtimeIdentifier, 'win')
        run: |
          mkdir -p _pkg
          zip -r _pkg/Lagrange.OneBot_${{ matrix.runtimeIdentifier }}_${{ matrix.framework }}_SelfContained.zip ./Lagrange.OneBot/bin/Release/${{ matrix.framework }}/${{ matrix.runtimeIdentifier }}/publish

      - name: Package (Linux/macOS → tar.gz)
        if: "!contains(matrix.runtimeIdentifier, 'win')"
        run: |
          mkdir -p _pkg
          tar -czvf _pkg/Lagrange.OneBot_${{ matrix.runtimeIdentifier }}_${{ matrix.framework }}_SelfContained.tar.gz ./Lagrange.OneBot/bin/Release/${{ matrix.framework }}/${{ matrix.runtimeIdentifier }}/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lagrange.OneBot_${{ matrix.runtimeIdentifier }}_${{ matrix.framework }}_SelfContained
          path: _pkg/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./_release
          merge-multiple: true

      - name: Delete old nightly release
        run: gh release delete nightly --cleanup-tag -y -R ${{ github.repository }} || true

      - name: Create nightly release
        run: |
          echo -e "> ⚠️This is a nightly release.\r\n> ⚠️This is not the latest version.\r\n> Auto-generated from commit ${{ github.sha }}" > note
          gh release create nightly -F ./note -p -t "Nightly Release" -R ${{ github.repository }}

      - name: Upload release assets
        run: |
          for file in ./_release/*; do
            gh release upload nightly "$file" -R ${{ github.repository }}
          done
